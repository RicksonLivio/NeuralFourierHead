[project]
name = "neural-fourier-head"
version = "2.0.0"
description = "Neural Fourier Head: camada de saída interpretável (decomposição espectral exata e identificável) para previsão multi-passo em PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rickson Livio de Souza Gaspar" }]
keywords = ["time series", "forecasting", "explainability", "fourier", "pytorch", "xai"]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
